name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Neural audio for every phrase. Engine is chosen with the TTS_ENGINE
      # repository variable (edge by default: free, no key needed).
      - uses: actions/setup-python@v5
        if: ${{ (vars.TTS_ENGINE || 'edge') == 'edge' }}
        with:
          python-version: "3.12"
      - run: pip install edge-tts
        if: ${{ (vars.TTS_ENGINE || 'edge') == 'edge' }}
      - uses: actions/cache@v4
        with:
          path: .audio-cache
          key: audio-${{ vars.TTS_ENGINE || 'edge' }}-${{ vars.TTS_VOICE }}-${{ hashFiles('content/**/*.json') }}
          restore-keys: audio-${{ vars.TTS_ENGINE || 'edge' }}-${{ vars.TTS_VOICE }}-
      - run: npm run audio -- --out dist/audio
        env:
          TTS_ENGINE: ${{ vars.TTS_ENGINE }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
